[package]
name = "harness"
version = "0.1.0"
edition = "2021"

# Deps are added per-module as each lands, not up front. fastembed/ort pull a
# ~7 minute cold build, so they arrive with the memory layer (§4b), not before.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
fastembed = "6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    # Needed for SSE: this provider cuts any non-streamed request off at ~30s.
    "stream",
] }
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Both of these are ALREADY in the lock file, pulled in by axum's `ws` feature -
# naming them here exposes them to our own code and compiles nothing new. They
# are what lets src/browser.rs speak CDP to a real browser without a daemon,
# an MCP hop, or SnareVec's human-only config gate (§12e).
tokio-tungstenite = "0.29"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
